services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature_api
      dockerfile: Dockerfile
    container_name: smarthome-temperature-api
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: smarthome-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - smarthome-network

  device-service:
    build:
      context: ./device_service
      dockerfile: Dockerfile
    container_name: smarthome-device-service
    environment:
      - PORT=8002
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry-service:
    build:
      context: ./telemetry_service
      dockerfile: Dockerfile
    container_name: smarthome-telemetry-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - PORT=8003
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - smarthome-network

  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: smarthome-api-gateway
    depends_on:
      device-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      - PORT=8005
      - DEVICE_API_URL=http://device-service:8002
      - MONOLITH_API_URL=http://app:8080
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672
    ports:
      - "8005:8005"
    restart: unless-stopped
    networks:
      - smarthome-network

  house-hub:
    build:
      context: ./house_hub
      dockerfile: Dockerfile
    container_name: smarthome-house-hub
    depends_on:
      api-gateway:
        condition: service_started
    environment:
      - GATEWAY_API_URL=http://api-gateway:8005
      - TICK_SECONDS=4
    restart: unless-stopped
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge