openapi: 3.0.3
info:
  title: WarmHouse — Device API
  version: 1.0.0

servers:
  - url: http://localhost:8002/api/v1

paths:
  /devices/{device_id}:
    get:
      summary: Получить информацию об устройстве
      description: Возвращает паспорт устройства и его текущее состояние. Чужое устройство — `404`.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Информация об устройстве
          content:
            application/json:
              schema:
                type: object
                required: [id, house_id, serial_number, type, capabilities, status, state]
                properties:
                  id: {type: string, format: uuid}
                  house_id: {type: string, format: uuid}
                  serial_number: {type: string, example: WH-TH-000123}
                  type: {type: string, example: thermostat}
                  capabilities:
                    type: object
                    required: [actions]
                    properties:
                      actions: {type: array, items: {type: string}}
                  status: {type: string, enum: [online, offline]}
                  state: {type: object, additionalProperties: true}
              examples:
                thermostat:
                  summary: Термостат
                  value:
                    id: 3f1c2a9e-3b4d-4c5e-8f7a-1b2c3d4e5f60
                    house_id: 8f14e45f-ea4e-4b7a-9b2c-6d1f0e2a7c11
                    serial_number: WH-TH-000123
                    type: thermostat
                    capabilities: {actions: [set_temperature, turn_on, turn_off]}
                    status: online
                    state: {power: 'on', target_temperature: 22.0, current_temperature: 21.4}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}

  /devices/{device_id}/state:
    patch:
      summary: Обновить состояние устройства
      description: |
        Частичное обновление: переданные ключи `state` заменяют текущие,
        остальные сохраняются.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: {type: object, additionalProperties: true}
            examples:
              hubReport:
                summary: Хаб сообщает состояние
                value:
                  state: {power: 'off', target_temperature: 21.0, current_temperature: 20.8}
      responses:
        '200':
          description: Новое состояние устройства
          content:
            application/json:
              schema:
                type: object
                required: [device_id, state, updated_at]
                properties:
                  device_id: {type: string, format: uuid}
                  state: {type: object, additionalProperties: true}
                  updated_at: {type: string, format: date-time}
              examples:
                updated:
                  value:
                    device_id: 3f1c2a9e-3b4d-4c5e-8f7a-1b2c3d4e5f60
                    state: {power: 'off', target_temperature: 21.0, current_temperature: 20.8}
                    updated_at: '2026-11-12T10:25:01Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}

  /devices/{device_id}/commands:
    post:
      summary: Отправить команду устройству
      description: |
        Команда ставится в очередь и будет выдана хабу при следующем опросе,
        поэтому успех — `202`, а не `200`. `action` должен быть в `capabilities.actions`.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, params]
              properties:
                action: {type: string, example: set_temperature}
                params:
                  type: object
                  additionalProperties: true
                  description: Параметры действия; для действий без параметров — `{}`
            examples:
              setTemperature:
                summary: Установить температуру
                value:
                  action: set_temperature
                  params: {target: 22.5}
      responses:
        '202':
          description: Команда принята и поставлена в очередь
          content:
            application/json:
              schema:
                type: object
                required: [id, device_id, action, params, status, created_at]
                properties:
                  id: {type: string, format: uuid}
                  device_id: {type: string, format: uuid}
                  action: {type: string}
                  params: {type: object, additionalProperties: true}
                  status:
                    type: string
                    description: PENDING — в очереди, DELIVERED — выдана, APPLIED — применена, FAILED — ошибка
                    enum: [PENDING, DELIVERED, APPLIED, FAILED]
                  created_at: {type: string, format: date-time}
              examples:
                queued:
                  value:
                    id: 9d1e2f3a-4b5c-6d7e-8f90-a1b2c3d4e5f6
                    device_id: 3f1c2a9e-3b4d-4c5e-8f7a-1b2c3d4e5f60
                    action: set_temperature
                    params: {target: 22.5}
                    status: PENDING
                    created_at: '2026-11-12T10:20:05Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnsupportedAction'}
        '500': {$ref: '#/components/responses/ServerError'}

components:
  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: {type: string, format: uuid}

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: DEVICE_NOT_FOUND}
        message: {type: string, example: Устройство не найдено}
  responses:
    BadRequest:
      description: Невалидный UUID или битый JSON
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            invalidUuid:
              value: {code: BAD_REQUEST, message: Параметр device_id не является UUID.}
    Unauthorized:
      description: Нет токена или токен истёк
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            noToken:
              value: {code: UNAUTHORIZED, message: Требуется заголовок Authorization.}
    NotFound:
      description: Устройство не найдено или недоступно вызывающему
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            notFound:
              value: {code: DEVICE_NOT_FOUND, message: Устройство 3f1c2a9e-3b4d-4c5e-8f7a-1b2c3d4e5f60 не найдено.}
    ValidationError:
      description: Некорректное состояние устройства
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            notAnObject:
              value: {code: VALIDATION_ERROR, message: Поле state должно быть JSON-объектом.}
    UnsupportedAction:
      description: Действие не поддерживается устройством
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            unsupported:
              value: {code: UNSUPPORTED_ACTION, message: Устройство типа thermostat не поддерживает действие set_mode.}
    ServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            internal:
              value: {code: INTERNAL_ERROR, message: Не удалось обработать запрос. Повторите позже.}
